<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'self'">
  <title>Set up or reset your password | RSS Infrastructure Visualisation Hub</title>
  <style>
    :root{font-family:Inter,Arial,sans-serif;color:#12354a;background:#f3f6f8;font-synthesis:none}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}
    main{width:min(100%,520px);background:#fff;border:1px solid #d7e1e8;border-radius:18px;padding:40px;box-shadow:0 16px 44px #12354a12}
    .brand{display:flex;align-items:center;gap:14px;margin-bottom:32px}
    .brand img{width:52px;height:52px;object-fit:contain}
    .brand span{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
    h1{margin:0 0 10px;font-size:28px;line-height:1.2}
    p{line-height:1.55;color:#526b7b}
    label{display:block;margin:20px 0 8px;font-size:14px;font-weight:700}
    input{width:100%;padding:14px 15px;border:1px solid #bdd0dd;border-radius:10px;font:inherit;color:inherit;background:#f7fafc}
    input:focus{outline:3px solid #ff790033;border-color:#ff7900}
    button{width:100%;margin-top:24px;padding:14px 18px;border:0;border-radius:10px;background:#ff7900;color:#fff;font:inherit;font-weight:700;cursor:pointer}
    button:disabled{opacity:.65;cursor:wait}
    #status{min-height:24px;margin:14px 0 0;color:#173f56}
    #status[data-error="true"]{color:#a32727}
    .back{display:inline-block;margin-top:14px;color:#005879;font-weight:700}
    @media(max-width:520px){main{padding:28px 22px}}
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="/rssi-logo.png" alt=""><span>RSS Infrastructure</span></div>
    <h1 id="page-title">Set up or reset your password</h1>
    <p id="page-description">Enter your work email and we’ll send a secure setup link. Open the email link to set your password here, then sign in.</p>
    <form id="request-form">
      <label for="work-email">Work email</label>
      <input id="work-email" name="email" type="email" autocomplete="email" maxlength="254" required>
      <button id="send-link" type="submit">Email me a secure setup link</button>
    </form>
    <form id="recovery-form" hidden>
      <label for="new-password">New password</label>
      <input id="new-password" name="new-password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
      <button id="save-password" type="submit">Save new password</button>
    </form>
    <p id="status" role="status" aria-live="polite">Checking your recovery link…</p>
    <a class="back" id="sign-in-link" href="/">Return to sign in</a>
  </main>
  <script>
    const query = new URLSearchParams(window.location.search);
    const recovery = new URLSearchParams(window.location.hash.slice(1));
    let accessToken = recovery.get('access_token');
    const recoveryType = recovery.get('type');
    history.replaceState(null, '', window.location.pathname);
    const requestForm = document.getElementById('request-form');
    const email = document.getElementById('work-email');
    const sendLink = document.getElementById('send-link');
    const form = document.getElementById('recovery-form');
    const password = document.getElementById('new-password');
    const confirmPassword = document.getElementById('confirm-password');
    const submit = document.getElementById('save-password');
    const status = document.getElementById('status');
    const title = document.getElementById('page-title');
    const description = document.getElementById('page-description');
    const signInLink = document.getElementById('sign-in-link');
    email.value = query.get('email') || '';
    const api = async payload => {
      const response = await fetch('/api/acceptance', { method: 'POST', headers: {'content-type': 'application/json'}, cache: 'no-store', body: JSON.stringify(payload) });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || 'The request could not be completed. Try again.');
      return result;
    };
    const setStatus = (text, error = false) => {
      status.textContent = text;
      status.dataset.error = String(error);
    };
    if (accessToken && ['recovery', 'invite', 'signup'].includes(recoveryType)) {
      requestForm.hidden = true;
      form.hidden = false;
      if (recoveryType === 'invite') {
        title.textContent = 'Accept invitation and set password';
        description.textContent = 'Choose a password to activate your Visualisation Hub account. Then sign in with your work email and new password.';
        setStatus('Invitation accepted. Choose a password to activate your account.');
      } else {
        title.textContent = 'Set a new password';
        description.textContent = 'Choose a new password for your Visualisation Hub account. Use at least 12 characters.';
        setStatus('Secure link verified. Choose your new password.');
      }
    } else {
      accessToken = null;
      const linkError = recovery.get('error_description');
      setStatus(linkError ? 'This setup link has expired or was already used. Enter your work email to request a fresh link.' : 'Enter your work email and we’ll send a secure setup link. Open the email link to set your password here.', !!linkError);
    }
    requestForm.addEventListener('submit', async event => {
      event.preventDefault();
      const address = email.value.trim();
      if (!address) { setStatus('Enter your work email to continue.', true); email.focus(); return; }
      sendLink.disabled = true;
      setStatus('Sending your secure setup link…');
      try {
        const result = await api({op: 'password_recovery', email: address});
        setStatus((result.message || 'If this email has an account, password setup instructions will be sent.') + ' Open the email link to return here, set your password, then sign in.');
      } catch (error) {
        setStatus(error.message || 'We could not send the setup link. Try again.', true);
      } finally {
        sendLink.disabled = false;
      }
    });
    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (!accessToken) return;
      if (password.value.length < 12) {
        setStatus('Choose a password with at least 12 characters.', true);
        password.focus();
        return;
      }
      if (password.value !== confirmPassword.value) {
        setStatus('The passwords do not match.', true);
        confirmPassword.focus();
        return;
      }
      submit.disabled = true;
      setStatus('Updating your password…');
      try {
        try { await api({op: 'update_password', access_token: accessToken, password: password.value}); } catch (error) {
          accessToken = null;
          form.hidden = true;
          requestForm.hidden = false;
          setStatus(error.message || 'This setup link has expired or was already used. Request a fresh link.', true);
          return;
        }
        accessToken = null;
        form.reset();
        form.hidden = true;
        setStatus(recoveryType === 'invite' ? 'Password saved. Your invitation is complete. Continue to sign in.' : 'Password saved. Continue to sign in with your new password.');
        signInLink.textContent = 'Continue to sign in';
        signInLink.focus();
      } catch {
        setStatus('We could not reach the password service. Try again while the recovery link is valid.', true);
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
